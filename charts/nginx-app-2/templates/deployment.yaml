apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-app-2

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-app-2

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          ports:
            - containerPort: 80
