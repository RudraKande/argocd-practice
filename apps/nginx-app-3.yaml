apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-app-3
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/RudraKande/argocd-practice.git
    targetRevision: main
    path: charts/nginx-app-3

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
